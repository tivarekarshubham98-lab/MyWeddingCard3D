<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Royal Maroon Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4a0414"/>
      <stop offset="55%" stop-color="#25020a"/>
      <stop offset="100%" stop-color="#120004"/>
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#E8C15A"/>
      <stop offset="60%" stop-color="#C49626"/>
      <stop offset="90%" stop-color="#FBED96"/>
      <stop offset="100%" stop-color="#A57917"/>
    </linearGradient>

    <!-- Subtle Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ornate Luxury Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
  <rect x="36" y="36" width="1128" height="558" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8 5" opacity="0.6"/>

  <!-- Corner Ornaments -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <!-- Top-Left -->
    <path d="M 45 75 L 45 45 L 75 45"/>
    <circle cx="55" cy="55" r="4" fill="url(#goldGrad)"/>
    <!-- Top-Right -->
    <path d="M 1155 75 L 1155 45 L 1125 45"/>
    <circle cx="1145" cy="55" r="4" fill="url(#goldGrad)"/>
    <!-- Bottom-Left -->
    <path d="M 45 555 L 45 585 L 75 585"/>
    <circle cx="55" cy="575" r="4" fill="url(#goldGrad)"/>
    <!-- Bottom-Right -->
    <path d="M 1155 555 L 1155 585 L 1125 585"/>
    <circle cx="1145" cy="575" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Top Ganesh Emblem -->
  <g transform="translate(600, 110)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="38" fill="rgba(37, 2, 10, 0.7)" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="0" y="14" font-family="'Yatra One', 'Tiro Devanagari Marathi', serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">श्री</text>
  </g>

  <!-- Mantra -->
  <text x="600" y="195" font-family="'Yatra One', 'Tiro Devanagari Marathi', serif" font-size="22" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">
    ॥ श्री गणेशाय नमः ॥
  </text>

  <!-- Flourish Ribbon / Badge -->
  <g transform="translate(600, 245)">
    <rect x="-160" y="-22" width="320" height="42" rx="21" fill="rgba(74, 4, 20, 0.85)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="7" font-family="'Yatra One', 'Rozha One', serif" font-size="20" letter-spacing="3" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">
      ॥ शुभविवाह निमंत्रण ॥
    </text>
  </g>

  <!-- Couple Names (Centerpiece Calligraphy) -->
  <g transform="translate(600, 360)">
    <!-- Groom Name -->
    <text x="-130" y="0" font-family="'Rozha One', 'Yatra One', serif" font-size="56" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">
      चि. शुभम
    </text>
    
    <!-- Heart / Sang Connector -->
    <text x="0" y="-8" font-family="'Amita', cursive" font-size="28" font-weight="bold" fill="#FFF8D6" text-anchor="middle">
      संग
    </text>
    <circle cx="0" cy="18" r="4" fill="url(#goldGrad)"/>

    <!-- Bride Name -->
    <text x="140" y="0" font-family="'Rozha One', 'Yatra One', serif" font-size="56" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">
      चि. सौ. कां. प्रिया
    </text>
  </g>

  <!-- Poetic Invitation Message -->
  <text x="600" y="450" font-family="'Amita', 'Tiro Devanagari Marathi', cursive" font-size="22" fill="#F4E8D1" text-anchor="middle" opacity="0.95">
    “सस्नेह निमंत्रण! आमच्या शुभविवाह सोहळ्यास आपली सहकुटुंब उपस्थिती प्रार्थनीय आहे.”
  </text>

  <!-- Gold Bottom Ribbon with Muhurat & View Cue -->
  <g transform="translate(600, 520)">
    <rect x="-240" y="-20" width="480" height="40" rx="20" fill="rgba(37, 2, 10, 0.9)" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <text x="0" y="6" font-family="'Tiro Devanagari Marathi', 'Gotu', sans-serif" font-size="17" fill="#FFEAA7" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      ❈ मार्गशीर्ष शुद्ध द्वितीया • सस्नेह आमंत्रण पाहण्यासाठी येथे क्लिक करा ❈
    </text>
  </g>
</svg>

